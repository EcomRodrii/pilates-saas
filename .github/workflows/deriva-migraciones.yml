name: Deriva de migraciones

# Comprueba que supabase/migrations/ y lo aplicado en producción digan lo mismo.
#
# NO corre en pull_request a propósito: al abrir un PR, su migración todavía no
# está aplicada — eso es lo normal, no un fallo. La deriva solo es un defecto
# DESPUÉS de mergear, que es cuando "mergeado" empieza a leerse como "aplicado".
#
# Va en su propio workflow y no como un job más de ci.yml para que el `schedule`
# no arrastre al build y a los 12 shards de e2e una vez al día.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  schedule:
    # 07:17 UTC. Minuto raro a propósito: GitHub encola con retraso los crons en
    # punto, cuando los lanza todo el mundo.
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  deriva:
    name: Repo ↔ producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sin `npm ci`: el script es Node pelado, sin dependencias. Y sin cliente
      # de Postgres en npm — `psql` ya viene en la imagen de ubuntu-latest, así
      # que leer una tabla no justifica añadir una dependencia al repo.
      - name: Autocomprobación del propio check
        run: node scripts/comprobar-deriva-migraciones.mjs --autocomprobacion

      # Los ficheros de migración que viven en un PR ABIERTO y todavía no en
      # main. Aquí la migración se aplica a producción ANTES de mergear su PR,
      # así que durante esa ventana el check vería "aplicada, sin fichero" —
      # rojo por el flujo normal. Ver el comentario de `nombresEnPRsAbiertos`
      # en el script para por qué esto y no una ventana de tiempo.
      #
      # ⚠️ Se piden los PR ABIERTOS por número y se traen SOLO esas cabezas.
      # El atajo `+refs/pull/*/head:...` parece equivalente y no lo es: trae
      # TODOS los PR de la historia del repo (medido: 1220 aquí), incluidos los
      # cerrados sin mergear. Con eso, una migración aplicada en producción cuyo
      # fichero se quedó en un PR abandonado quedaría indultada PARA SIEMPRE —
      # justo el fallo que este check existe para cazar, y en silencio.
      #
      # `--depth=1`: basta el árbol de la punta para listar nombres, no hace
      # falta historia. Si algo falla aquí, la variable se queda vacía y el check
      # vuelve a ser estricto — nunca al revés.
      - name: Migraciones que vienen en un PR abierto
        id: en_prs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nums=$(gh pr list --state open --limit 100 --json number --jq '.[].number') || exit 0
          [ -z "$nums" ] && exit 0
          refs=""
          for n in $nums; do refs="$refs +refs/pull/$n/head:refs/remotes/pr/$n"; done
          git fetch -q --depth=1 origin $refs || exit 0
          # ⚠️ `ls-tree` lista TODAS las migraciones de esa rama, no las que el PR
          # aporta: en una rama vieja son ~300 ficheros. Hay que restar las que
          # ya están en main para quedarse con las que el PR trae de nuevo. Sin
          # esta resta el indulto se vuelve casi universal.
          #
          # Se resta por lista local en vez de `git diff main...pr`: eso exigiría
          # historia (merge-base) y aquí se traen las puntas con --depth=1.
          ls supabase/migrations/ | sed 's#.*/##' | sort -u > /tmp/migs_main
          {
            echo 'lista<<FIN'
            for n in $nums; do
              git ls-tree -r --name-only "refs/remotes/pr/$n" -- supabase/migrations/ 2>/dev/null || true
            done | sed 's#.*/##' | sort -u | comm -23 - /tmp/migs_main
            echo 'FIN'
          } >> "$GITHUB_OUTPUT"

      # La credencial es la del rol `deriva_ci` (migr 20260818010000): SELECT
      # sobre supabase_migrations.schema_migrations y NADA más. No es el
      # service-role ni un token de Management API — si se filtrara, lo que se
      # lleva es el catálogo de nombres de migraciones, que ya está en el repo.
      #
      # `-v ON_ERROR_STOP=1` es imprescindible: sin él, psql se traga el error de
      # conexión, escupe vacío por stdout y el pipe le daría al script una lista
      # de cero elementos. El script también lo rechaza por su cuenta, pero la
      # primera línea de defensa es no producir basura.
      - name: Cruzar contra producción
        env:
          DERIVA_DATABASE_URL: ${{ secrets.DERIVA_DATABASE_URL }}
          MIGRACIONES_EN_PRS_ABIERTOS: ${{ steps.en_prs.outputs.lista }}
        run: |
          if [ -z "$DERIVA_DATABASE_URL" ]; then
            echo "Falta el secreto DERIVA_DATABASE_URL (rol deriva_ci)." >&2
            exit 1
          fi
          psql "$DERIVA_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            'select name from supabase_migrations.schema_migrations' \
            | node scripts/comprobar-deriva-migraciones.mjs
